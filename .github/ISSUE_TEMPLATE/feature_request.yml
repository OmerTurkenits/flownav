name: Feature request
description: Suggest a command, check, or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation, not just the solution. For example, "I rename nodes often and want to catch X".
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like flownav to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
